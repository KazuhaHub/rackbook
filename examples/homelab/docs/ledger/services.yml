# 服务端口：每台设备上实际开着的服务。device 为 all 表示所有设备。
# exposure 开放范围（可多选）：public / tailscale / lan / localhost / cloudflare。
- {device: all, service: Tailscale, port: UDP 41641, exposure: [public], notes: 规范端口}

# --- gw-example-springfield-or-us-home
- {device: gw-example-springfield-or-us-home, service: SSH, port: TCP 10511, exposure: [lan, tailscale]}
- {device: gw-example-springfield-or-us-home, service: Web 后台, port: TCP 60000, exposure: [lan, tailscale]}

