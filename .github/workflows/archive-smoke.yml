# Reusable: test the release archives themselves, natively on every platform.
# verify.yml tests binaries built on each runner; the archives that are
# published are cross-compiled once by GoReleaser. This job takes those exact
# archives (the artifact uploaded by the caller), checks each one against
# checksums.txt, unpacks it and runs the binaries inside on their own platform.
name: archive-smoke

on:
  workflow_call:
    inputs:
      artifact:
        description: Name of the artifact that holds dist/*.tar.gz, dist/*.zip, checksums.txt and metadata.json
        type: string
        required: true

permissions:
  contents: read

jobs:
  archive:
    name: archive ${{ matrix.os }}-${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: linux, arch: amd64, runner: ubuntu-latest, ext: tar.gz, exe: "" }
          - { os: linux, arch: arm64, runner: ubuntu-24.04-arm, ext: tar.gz, exe: "" }
          - { os: darwin, arch: amd64, runner: macos-26-intel, ext: tar.gz, exe: "" }
          - { os: darwin, arch: arm64, runner: macos-latest, ext: tar.gz, exe: "" }
          - { os: windows, arch: amd64, runner: windows-latest, ext: zip, exe: ".exe" }
          - { os: windows, arch: arm64, runner: windows-11-arm, ext: zip, exe: ".exe" }
    defaults:
      run:
        shell: bash
    steps:
      # Only for scripts/smoke.sh; the binaries and the example config come from the archive.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ inputs.artifact }}
          path: release-dist
      - name: Checksum and unpack
        env:
          GOOS_: ${{ matrix.os }}
          GOARCH_: ${{ matrix.arch }}
          EXT: ${{ matrix.ext }}
        run: |
          version=$(grep -o '"version": *"[^"]*"' release-dist/metadata.json | head -n 1 | sed 's/.*"\([^"]*\)"$/\1/')
          test -n "$version"
          name="rackbook_${version}_${GOOS_}_${GOARCH_}.${EXT}"
          test -f "release-dist/$name"
          want=$(awk -v n="$name" '$2 == n { print $1 }' release-dist/checksums.txt)
          test -n "$want"
          if command -v sha256sum >/dev/null; then got=$(sha256sum "release-dist/$name" | cut -d' ' -f1)
          else got=$(shasum -a 256 "release-dist/$name" | cut -d' ' -f1); fi
          test "$got" = "$want" || { echo "checksum mismatch for $name"; exit 1; }
          mkdir x
          if [ "$EXT" = zip ]; then unzip -q "release-dist/$name" -d x; else tar -xzf "release-dist/$name" -C x; fi
          echo "VERSION=$version" >> "$GITHUB_ENV"
          echo "$name: checksum ok, unpacked"
      - name: Binaries report the release version
        env:
          EXE: ${{ matrix.exe }}
        run: |
          for cmd in rackbook rackbook-entra rackbook-notify; do
            out=$("./x/$cmd$EXE" --version | head -n 1 | tr -d '\r')
            echo "$out"
            # rackbook and rackbook-entra print "<name> <version>", rackbook-notify only the version.
            test "${out##* }" = "$VERSION"
          done
      - name: Smoke test of the archived rackbook
        env:
          EXE: ${{ matrix.exe }}
        run: bash scripts/smoke.sh "./x/rackbook$EXE" x/examples/homelab/rackbook.yml
