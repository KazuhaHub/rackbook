name: ci

on:
  pull_request:
  push:
    branches: [main]

# A new push to a pull request makes the run in flight stale, so that run is
# cancelled; separate PRs still run side by side. A main push is never stale:
# it gets its own group (the run id) and cancels nothing, so every commit on
# main keeps a verdict of its own even when two merges arrive seconds apart.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event_name }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# No permissions by default; each job asks for read access to the code only.
permissions: {}

env:
  # Ignore any go.work file and use exactly the Go version from go.mod.
  GOWORK: "off"
  GOTOOLCHAIN: local

# Layout. The required checks are go, web, fuzz, cross-compile and docker.
# go and web are gates: each passes only when every job under it passed, or
# when the pull request changes nothing those jobs look at and they were all
# skipped. The jobs under a gate run side by side.
#
# Which jobs a pull request needs comes from the files it changes
# (scripts/ci-changes.sh, job "changes"). A push to main runs every job. If
# "changes" fails, the gates fail and every other job runs, so a broken filter
# never turns into a skipped check. Each step runs a Makefile target, the same
# one used locally (make ci runs them all).
jobs:
  changes:
    name: changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      go: ${{ steps.pick.outputs.go }}
      web: ${{ steps.pick.outputs.web }}
      fuzz: ${{ steps.pick.outputs.fuzz }}
      cross: ${{ steps.pick.outputs.cross }}
      docker: ${{ steps.pick.outputs.docker }}
    steps:
      # A pull request is checked out as its merge commit: its first parent is
      # the base branch, so HEAD^1..HEAD is what the pull request changes.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 2
      - id: pick
        shell: bash
        env:
          EVENT: ${{ github.event_name }}
        run: |
          if [ "$EVENT" = pull_request ]; then
            git diff --name-only HEAD^1 HEAD | scripts/ci-changes.sh | tee -a "$GITHUB_OUTPUT"
          else
            printf 'go=true\nweb=true\nfuzz=true\ncross=true\ndocker=true\n' | tee -a "$GITHUB_OUTPUT"
          fi

  # --- go ------------------------------------------------------------------------
  go-lint:
    name: go-lint
    needs: changes
    # !cancelled(): runs when "changes" failed too (its outputs are then empty)
    if: ${{ !cancelled() && needs.changes.outputs.go != 'false' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
      # setup-go installs the go line of go.mod; fail if any other Go is on PATH.
      - name: Go version matches go.mod
        shell: bash
        run: test "$(go env GOVERSION)" = "go$(go list -m -f '{{.GoVersion}}')"
      - run: make fmt-check
      - run: make vet
      - run: make staticcheck
      - run: make actionlint

  go-test:
    name: go-test
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.go != 'false' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
      - name: Go version matches go.mod
        shell: bash
        run: test "$(go env GOVERSION)" = "go$(go list -m -f '{{.GoVersion}}')"
      # The infra secrets editor is tested against the real sops and age: the
      # tests skip without them, so CI installs the pinned ones (checksummed) and
      # fails when they are missing.
      - name: Install sops and age
        run: |
          scripts/install-sops-age.sh "$RUNNER_TEMP/bin"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      # The tests need no console build: web/dist holds only a .gitkeep and the
      # server then shows its "console not built" page.
      - name: go test -race
        env:
          RACKBOOK_REQUIRE_SOPS: "1"
        run: make test TESTFLAGS=-count=1

  go:
    name: go
    needs: [changes, go-lint, go-test]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: go-lint and go-test passed, or were not needed
        env:
          CHANGES: ${{ needs.changes.result }}
          WANT: ${{ needs.changes.outputs.go }}
          LINT: ${{ needs.go-lint.result }}
          TEST: ${{ needs.go-test.result }}
        run: |
          echo "changes=$CHANGES go=$WANT go-lint=$LINT go-test=$TEST"
          test "$CHANGES" = success
          if [ "$WANT" = false ]; then
            test "$LINT" = skipped && test "$TEST" = skipped
          else
            test "$WANT" = true && test "$LINT" = success && test "$TEST" = success
          fi

  # --- web -----------------------------------------------------------------------
  web-check:
    name: web-check
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.web != 'false' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # No .nvmrc or engines field exists, so use the Node version the Dockerfile and release use.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      # npm ci installs exactly what package-lock.json says.
      - run: npm --prefix web ci
      # lint, typecheck, the check: scripts other than i18n-dom, and the build
      - run: make web-check

  web-i18n-dom:
    name: web-i18n-dom
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.web != 'false' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm --prefix web ci
      # loads each page in each language pair, switches, and compares with a
      # fresh load (headless Chrome, mock API); the pairs run side by side
      - run: make web-i18n-dom

  web:
    name: web
    needs: [changes, web-check, web-i18n-dom]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: web-check and web-i18n-dom passed, or were not needed
        env:
          CHANGES: ${{ needs.changes.result }}
          WANT: ${{ needs.changes.outputs.web }}
          CHECK: ${{ needs.web-check.result }}
          DOM: ${{ needs.web-i18n-dom.result }}
        run: |
          echo "changes=$CHANGES web=$WANT web-check=$CHECK web-i18n-dom=$DOM"
          test "$CHANGES" = success
          if [ "$WANT" = false ]; then
            test "$CHECK" = skipped && test "$DOM" = skipped
          else
            test "$WANT" = true && test "$CHECK" = success && test "$DOM" = success
          fi

  # --- the rest ------------------------------------------------------------------
  govulncheck:
    name: govulncheck
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.go != 'false' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
      # setup-go installs the go line of go.mod; fail if any other Go is on PATH.
      - name: Go version matches go.mod
        shell: bash
        run: test "$(go env GOVERSION)" = "go$(go list -m -f '{{.GoVersion}}')"
      # Reports known vulnerabilities in the Go standard library and modules that the code actually calls.
      - run: go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...

  # Pull requests run it only when the secret scanner or the modules change.
  fuzz:
    name: fuzz
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.fuzz != 'false' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
      # setup-go installs the go line of go.mod; fail if any other Go is on PATH.
      - name: Go version matches go.mod
        shell: bash
        run: test "$(go env GOVERSION)" = "go$(go list -m -f '{{.GoVersion}}')"
      # A short run: it only catches crashes in the secret scanner, it does not prove there are none.
      - run: go test -run '^$' -fuzz '^FuzzScan$' -fuzztime=20s ./internal/secretscan/

  # Pull requests run it only when platform-dependent Go code or the modules
  # change (see platform_specific in scripts/ci-changes.sh): other Go code
  # builds the same on every target, and go-test builds it for linux/amd64.
  cross-compile:
    name: cross-compile
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.cross != 'false' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
      # setup-go installs the go line of go.mod; fail if any other Go is on PATH.
      - name: Go version matches go.mod
        shell: bash
        run: test "$(go env GOVERSION)" = "go$(go list -m -f '{{.GoVersion}}')"
      # Release builds are static (no cgo), so prove every target still compiles that way.
      - name: Build every release target
        env:
          CGO_ENABLED: "0"
        run: |
          for os in linux darwin windows; do
            for arch in amd64 arm64; do
              echo "== $os/$arch"
              for cmd in rackbook rackbook-entra rackbook-notify; do
                GOOS=$os GOARCH=$arch go build -trimpath -o /dev/null "./cmd/$cmd"
              done
            done
          done
      # Build for the runner itself and run it once. The full smoke test runs natively on every platform in verify.yml at release.
      - name: Smoke test linux/amd64
        env:
          CGO_ENABLED: "0"
        run: |
          go build -trimpath -o rackbook ./cmd/rackbook
          ./rackbook version
          ./rackbook check --config examples/homelab/rackbook.yml
          go build -trimpath -o rackbook-entra ./cmd/rackbook-entra
          go build -trimpath -o rackbook-notify ./cmd/rackbook-notify
          ./rackbook-entra --version
          ./rackbook-notify --version

  # Pull requests run it only when the Dockerfile, .dockerignore or the
  # dependencies (go.mod, go.sum, web/package*.json) change; the code itself is
  # built and tested by go-test and web-check.
  docker:
    name: docker
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.docker != 'false' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # QEMU lets the amd64 runner build the arm64 image.
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      # The Dockerfile builds the console and the binary itself; nothing is pushed.
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
