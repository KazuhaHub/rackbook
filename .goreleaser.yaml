version: 2

project_name: rackbook

# The console (web/dist) is built once, before GoReleaser runs: the release
# workflow downloads the build that the verification matrix tested, and locally
# `make web` produces it. The binaries are cross-compiled in this single job.
before:
  hooks:
    - sh -c 'test -f web/dist/index.html || { echo web/dist is missing, run make web first; exit 1; }'

builds:
  - id: rackbook
    main: ./cmd/rackbook
    binary: rackbook
    env:
      - CGO_ENABLED=0
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]
    flags:
      - -trimpath
    ldflags:
      - -s -w -X main.version={{.Version}}

archives:
  - id: rackbook
    formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files:
      - LICENSE
      - README.md
      - examples/**/*

checksum:
  name_template: checksums.txt

changelog:
  use: github
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"

release:
  draft: false
