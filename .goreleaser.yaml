version: 2

project_name: rackbook

# The console (web/dist) is built once, before GoReleaser runs: the release
# workflow downloads the build that the verification matrix tested, and locally
# `make web` produces it. The binaries are cross-compiled in this single job.
before:
  hooks:
    - sh -c 'test -f web/dist/index.html || { echo web/dist is missing, run make web first; exit 1; }'

builds:
  - id: rackbook
    main: ./cmd/rackbook
    binary: rackbook
    env:
      - CGO_ENABLED=0
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]
    flags:
      - -trimpath
    ldflags:
      - -s -w -X main.version={{.Version}}
  # Modules: separate executables that use only the public HTTP API
  # (docs/modules.md). They ship in the same archives.
  - id: rackbook-entra
    main: ./cmd/rackbook-entra
    binary: rackbook-entra
    env:
      - CGO_ENABLED=0
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]
    flags:
      - -trimpath
    ldflags:
      - -s -w -X main.version={{.Version}}
  - id: rackbook-notify
    main: ./cmd/rackbook-notify
    binary: rackbook-notify
    env:
      - CGO_ENABLED=0
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]
    flags:
      - -trimpath
    ldflags:
      - -s -w -X main.version={{.Version}}

archives:
  - id: rackbook
    ids: [rackbook, rackbook-entra, rackbook-notify]
    formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files:
      - LICENSE
      - README.md
      - docs/modules.md
      - examples/**/*

checksum:
  name_template: checksums.txt

changelog:
  use: github
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"

release:
  # Created as a draft with all assets, then published in one step by the
  # workflow, so the repository can use immutable releases.
  draft: true
  replace_existing_draft: true
